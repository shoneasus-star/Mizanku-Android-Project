name: Build Dzikr APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dzikr-Android-Studio.zip'
      - '.github/workflows/dzikr-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project archive
        run: |
          test -f Dzikr-Android-Studio.zip || {
            echo "::error::Dzikr-Android-Studio.zip belum ada di root repository."
            exit 1
          }
          unzip -t Dzikr-Android-Studio.zip

      - name: Extract Android project
        run: |
          mkdir -p DzikrBuild
          unzip -oq Dzikr-Android-Studio.zip -d DzikrBuild

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p DzikrBuild assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dzikr-APK
          path: DzikrBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
