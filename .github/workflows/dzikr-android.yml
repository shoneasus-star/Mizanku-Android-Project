name: Build Dzikr APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'dzikr-app.zip'
      - '.github/workflows/dzikr-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout source
      - name: Verify Dzikr source archive
        run: |
          test -f dzikr-app.zip
          unzip -t dzikr-app.zip
      - name: Prepare Android WebView project
        run: |
          mkdir -p DzikrBuild/app/src/main/assets/www DzikrBuild/app/src/main/java/id/dzikr/app
          unzip -oq dzikr-app.zip -d DzikrSource
          test -f DzikrSource/dzikr-app/index.html
          cp -R DzikrSource/dzikr-app/. DzikrBuild/app/src/main/assets/www/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("DzikrBuild/app/src/main/assets/www/index.html")
          html = p.read_text(encoding="utf-8")
          shim = r"""<script>
          (function () {
            var announced = false;
            function notify(message) {
              try {
                if (typeof window.toast === "function") window.toast(message);
                else {
                  var el = document.getElementById("dzikr-haptic-status");
                  if (!el) {
                    el = document.createElement("div");
                    el.id = "dzikr-haptic-status";
                    el.style.cssText = "position:fixed;z-index:2147483647;left:50%;bottom:24px;transform:translateX(-50%);background:#123c36;color:white;padding:12px 18px;border-radius:24px;font:600 14px sans-serif;box-shadow:0 4px 18px #0004;max-width:90%;text-align:center";
                    (document.body || document.documentElement).appendChild(el);
                  }
                  el.textContent = message;
                  el.style.display = "block";
                  setTimeout(function(){ if(el) el.style.display="none"; }, 2400);
                }
              } catch (_) {}
            }
            function vibrate(pattern) {
              try {
                var b = window.DzikrHaptics;
                if (!b) { notify("Getar belum tersedia pada perangkat ini"); return false; }
                var ok = false;
                if (typeof pattern === "number") ok = b.vibrate(Math.max(30, pattern));
                else if (pattern && typeof pattern.length === "number") {
                  var values = Array.prototype.slice.call(pattern, 0, 32).map(function(v){ return Math.max(0, Math.min(2000, Number(v)||0)); });
                  if (values.length) ok = b.vibratePattern(values.join(","));
                }
                if (ok && !announced) { announced = true; notify("Getar aktif"); }
                else if (!ok) notify("Getar gagal dijalankan");
                return !!ok;
              } catch (_) { notify("Getar gagal dijalankan"); return false; }
            }
            try { Object.defineProperty(navigator, "vibrate", { configurable:true, writable:true, value:vibrate }); }
            catch (_) { try { navigator.vibrate = vibrate; } catch (e) {} }
            try { Object.defineProperty(Navigator.prototype, "vibrate", { configurable:true, writable:true, value:vibrate }); } catch (_) {}
          })();
          </script>"""
          if "DzikrHaptics" not in html:
              html = re.sub(r"(<head[^>]*>)", lambda m: m.group(1) + shim, html, count=1, flags=re.I) if re.search(r"<head[^>]*>", html, flags=re.I) else shim + html
              p.write_text(html, encoding="utf-8")
          PY
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p DzikrBuild/app/src/main/res/mipmap-$density
            cp DzikrSource/dzikr-app/icons/icon-512.png DzikrBuild/app/src/main/res/mipmap-$density/ic_launcher.png
            cp DzikrSource/dzikr-app/icons/icon-512.png DzikrBuild/app/src/main/res/mipmap-$density/ic_launcher_round.png
          done
          cat > DzikrBuild/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Dzikr"
          include(":app")
          EOF
          cat > DzikrBuild/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > DzikrBuild/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > DzikrBuild/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'id.dzikr.app'
            compileSdk 35
            defaultConfig {
              applicationId 'id.dzikr.app'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > DzikrBuild/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <application android:allowBackup="true" android:label="Dzikr"
              android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
              android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenSize" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > DzikrBuild/app/src/main/java/id/dzikr/app/MainActivity.java <<'EOF'
          package id.dzikr.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.os.Build;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.graphics.Color;
          import android.view.Window;
          public class MainActivity extends Activity {
            private Vibrator vibrator;

            public class DzikrHaptics {
              @JavascriptInterface
              public boolean vibrate(long durationMs) {
                try {
                  if (vibrator == null || !vibrator.hasVibrator()) return false;
                  long duration = Math.max(1L, Math.min(durationMs, 2000L));
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    vibrator.vibrate(VibrationEffect.createOneShot(duration, VibrationEffect.DEFAULT_AMPLITUDE));
                  } else {
                    vibrator.vibrate(duration);
                  }
                  return true;
                } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public boolean vibratePattern(String csv) {
                try {
                  if (vibrator == null || !vibrator.hasVibrator() || csv == null) return false;
                  String[] parts = csv.split(",");
                  int count = Math.min(parts.length, 32);
                  long[] timings = new long[count];
                  for (int i = 0; i < count; i++) {
                    timings[i] = Math.max(0L, Math.min(Long.parseLong(parts[i].trim()), 2000L));
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    vibrator.vibrate(VibrationEffect.createWaveform(timings, -1));
                  } else {
                    vibrator.vibrate(timings, -1);
                  }
                  return true;
                } catch (Exception e) { return false; }
              }
            }
            private WebView webView;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              Window window = getWindow();
              window.setStatusBarColor(Color.rgb(15,118,110));
              window.setNavigationBarColor(Color.BLACK);
              vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
              webView = new WebView(this);
              webView.setHapticFeedbackEnabled(true);
              webView.addJavascriptInterface(new DzikrHaptics(), "DzikrHaptics");
              webView.setBackgroundColor(Color.WHITE);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(false);
              s.setJavaScriptCanOpenWindowsAutomatically(false);
              s.setSupportMultipleWindows(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              setContentView(webView);
              if (state == null) webView.loadUrl("file:///android_asset/www/index.html");
              else webView.restoreState(state);
            }
            @Override protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              if (webView != null) webView.saveState(out);
            }
            @Override public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
            @Override protected void onDestroy() {
              if (webView != null) { webView.destroy(); webView = null; }
              super.onDestroy();
            }
          }
          EOF
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p DzikrBuild assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dzikr-APK
          path: DzikrBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
